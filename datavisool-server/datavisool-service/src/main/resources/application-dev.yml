spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1GB
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      url: jdbc:mysql://localhost:3306/datavisool_server?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8
      username: root
      password: ${DB_PASSWORD}

# mybatis-plus配置
mybatis-plus:
  type-aliases-package: com.zsq.datavisoolservice.model
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  config: classpath:log4j2-spring.xml
  level:
    cn.jay.repository: debug
    com.zsq.datavisoolservice.service.impl.ai: debug


datavisool:
#  resource-path:
#    root: D:/path/to/datavisool-server
#    image: /static/images
#    cover: /static/covers
#    avatar: /static/avatar
#    remote-component: /static/components
  file:
    image-max-size: 10MB
    max-size: 20MB
  migration: # 是否自动跑sql脚本
    enable: true
