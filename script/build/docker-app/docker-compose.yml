name: ${DATAVISOOL_PROJECT_NAME:-datavisool-web-app}
services:
  app:
    image: ${DATAVISOOL_IMAGE:?请在 .env 中设置 DATAVISOOL_IMAGE}
    # Images are built or loaded explicitly; startup never pulls a different build.
    pull_policy: never
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?请在 .env 中设置宿主机数据库名称 DB_NAME}
      DB_USER: ${DB_USER:?请在 .env 中设置宿主机数据库账号 DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置宿主机数据库密码 DB_PASSWORD}
      # Keep default runtime data on the mounted volume when YAML paths are omitted.
      DATAVISOOL_RESOURCE_PATH_ROOT: /usr/app/resource
      DATAVISOOL_AI_STORAGE_PATH: /usr/app/resource/ai-driven
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai}
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ./config/application.yml
        target: /config/application.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./resource
        target: /usr/app/resource
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /datavisool/server/logs
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

