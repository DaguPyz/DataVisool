server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

spring:
  lifecycle:
    timeout-per-shutdown-phase: 45s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      url: "jdbc:mysql://127.0.0.1:3306/${DB_NAME}?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf-8"
      username: ${DB_USER}
      password: ${DB_PASSWORD}
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1GB

mybatis-plus:
  type-aliases-package: com.zsq.datavisoolservice.model
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

logging:
  config: classpath:log4j2-spring.xml

datavisool:
  mode: PROD
  # Docker allinone 的启动器默认提供授权、AI 存储和资源路径，无需填写；以下展示默认值。
  # ai:
  #   storage-path: /data/resource/ai-driven
  # resource-path:
  #   root: /data/resource
  #   image: /static/images
  #   cover: /static/covers
  #   avatar: /static/avatar
  #   remote-component: /static/components
  #   font: /static/font
  #   dynamic-script: /static/lib
  #   logo: /static/logo
  #   template-cover: /static/templateCover
  #   video: /static/videos
  #   model: /static/models
  file:
    image-max-size: 50MB
    avatar-max-size: 1MB
    max-size: 20MB
    video-max-size: 500MB
    model-max-size: 500MB
  migration:
    enable: true
  db:
    test-database-max-timeout: 10
